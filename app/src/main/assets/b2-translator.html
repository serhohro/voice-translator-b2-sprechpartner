<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перекладач UK ⇄ DE</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 10px auto; padding: 0 12px; background: #f5f5f5; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 15px;}

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: 1px solid #ccc; background: #e0e0e0; border-radius: 6px; }
        .tab-btn.active { background: #1a5fb4; color: white; border-color: #1a5fb4; }
        .screen { display: none; }
        .screen.active { display: block; }

        .row { margin: 10px 0; }
        button { font-size: 16px; padding: 12px 16px; margin-right: 8px; margin-bottom: 5px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; font-weight: bold;}
        button:disabled { background: #eee; color: #999; cursor: not-allowed; }
        input[type="password"] { font-size: 15px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; margin-top: 5px;}

        .box { background: #fff; border-radius: 8px; padding: 12px; margin-top: 10px; min-height: 60px; white-space: pre-wrap; border: 1px solid #e0e0e0; font-size: 18px;}
        .label { font-size: 14px; color: #333; margin-bottom: 4px; font-weight: bold; }
        .uk { border-left: 6px solid #1a5fb4; }
        .de { border-left: 6px solid #26a269; }
        .small { font-size: 13px; color: #666; text-align: center; margin: 10px 0;}

        .hint { background: #fff8e1; border-left: 4px solid #f9a825; padding: 10px 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
        .saved { color: #26a269; font-size: 13px; margin-left: 8px; }

        #chat { background: #fff; border-radius: 8px; padding: 12px; min-height: 200px; margin-top: 12px; white-space: pre-wrap; border: 1px solid #e0e0e0; max-height: 350px; overflow-y: auto;}
        .msg-user { color: #1a5fb4; margin: 6px 0; font-weight: bold; }
        .msg-ai { color: #26a269; margin: 6px 0; }
    </style>
</head>
<body>

<h1>Німецька мова B2</h1>

<div class="tabs">
    <button id="tab-translator" class="tab-btn active" onclick="switchTab('translator')">🔄 Перекладач</button>
    <button id="tab-trainer" class="tab-btn" onclick="switchTab('trainer')">🎓 Тренер B2</button>
</div>

<div class="row">
    <label>Gemini API Key:</label>
    <input type="password" id="geminiKey" placeholder="AIza...">
    <span class="saved" id="savedMsgGemini"></span>
</div>
<div class="row">
    <label>Groq API Key:</label>
    <input type="password" id="groqKey" placeholder="gsk_...">
    <span class="saved" id="savedMsgGroq"></span>
</div>

<div id="screen-translator" class="screen active">
    <div class="hint">Натисніть мікрофон, щоб перекласти фразу в реальному часі.</div>

    <div class="row">
        <button id="micUk" style="width: 100%; background: #1a5fb4; color: white;">🎤 Говорити українською</button>
    </div>
    <div class="row">
        <button id="micDe" style="width: 100%; background: #26a269; color: white;">🎤 Говорити німецькою</button>
    </div>
    <div class="row">
        <button id="stopBtn" style="width: 100%; background: #e74c3c; color: white;">⏹ Стоп</button>
    </div>

    <div class="row small" id="status">Готово.</div>

    <div class="row">
        <div class="label">Оригінал:</div>
        <div class="box uk" id="original">—</div>
    </div>
    <div class="row">
        <div class="label">Переклад:</div>
        <div class="box de" id="translated">—</div>
    </div>

    <div class="row">
        <div class="label">Ручне введення:</div>
        <textarea id="manualInput" style="width:100%;height:60px;font-size:16px;padding:8px;box-sizing:border-box; border: 1px solid #ccc; border-radius: 4px;" placeholder="Введіть текст..."></textarea>
        <div style="margin-top:6px; display: flex; gap: 10px;">
            <button id="sendUk" style="flex: 1;">Перекласти UK → DE</button>
            <button id="sendDe" style="flex: 1;">Перекласти DE → UK</button>
        </div>
    </div>
</div>

<div id="screen-trainer" class="screen">
    <div class="hint">
        <b>Режим екзаменатора:</b> Оберіть сценарій, натисніть 🎤 і говоріть німецькою. ШІ відповість вам та вкаже на помилки.
    </div>

    <div class="row">
        <label>Сценарій:</label>
        <select id="scenario" style="width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px;">
            <option value="praesentation">Teil 1: Selbstpräsentation (Розповідь про себе)</option>
            <option value="diskussion">Teil 2: Diskussion (Дискусія на тему)</option>
            <option value="planung">Teil 3: Gemeinsame Planung (Спільне планування)</option>
        </select>
    </div>

    <div class="row">
        <button id="micTrainer" style="width: 100%; background: #26a269; color: white;">🎤 Говорити німецькою</button>
    </div>
    <div class="row">
        <button id="stopTrainer" style="width: 100%; background: #e74c3c; color: white;">⏹ Стоп</button>
        <button id="resetTrainer" style="width: 100%;">🔄 Нова розмова</button>
    </div>

    <div class="row small" id="statusTrainer">Готово.</div>

    <div id="chat"></div>

    <div class="row">
        <div class="label">Або введіть текст вручну:</div>
        <textarea id="manualTrainer" style="width:100%;height:60px;font-size:16px;padding:8px;box-sizing:border-box; border: 1px solid #ccc; border-radius: 4px;" placeholder="Напишіть німецькою..."></textarea>
        <button id="sendTrainer" style="margin-top:6px; width: 100%;">Надіслати</button>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const originalEl = document.getElementById('original');
    const translatedEl = document.getElementById('translated');
    const savedMsgGemini = document.getElementById('savedMsgGemini');
    const savedMsgGroq = document.getElementById('savedMsgGroq');

    const statusTrainer = document.getElementById('statusTrainer');
    const chatEl = document.getElementById('chat');
    let history = [];

    let recognition = null;
    let listening = false;

    function switchTab(tabName) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('screen-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function initKeys() {
      const savedG = localStorage.getItem('geminiKey');
      if (savedG) {
        document.getElementById('geminiKey').value = savedG;
        savedMsgGemini.textContent = '✓ ключ збережено';
      }
      const savedGr = localStorage.getItem('groqKey');
      if (savedGr) {
        document.getElementById('groqKey').value = savedGr;
        savedMsgGroq.textContent = '✓ ключ збережено';
      }
    }
    document.getElementById('geminiKey').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val) {
        localStorage.setItem('geminiKey', val);
        savedMsgGemini.textContent = '✓ ключ збережено';
      }
    });
    document.getElementById('groqKey').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val) {
        localStorage.setItem('groqKey', val);
        savedMsgGroq.textContent = '✓ ключ збережено';
      }
    });
    initKeys();

    async function callGeminiAPI(promptText, sysPrompt = null) {
      const key = document.getElementById('geminiKey').value.trim();
      if (!key) throw new Error('Немає ключа Gemini');

      let body = { contents: [{ role: 'user', parts: [{ text: promptText }] }] };
      if (sysPrompt) {
        body.system_instruction = { parts: [{ text: sysPrompt }] };
      }

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      );

      if (!res.ok) {
        if (res.status === 429) throw new Error('RATE_LIMIT');
        throw new Error('Gemini: ' + res.status);
      }
      const data = await res.json();
      return (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
    }

    async function callGroqAPI(promptText, sysPrompt = null) {
      const key = document.getElementById('groqKey').value.trim();
      if (!key) throw new Error('Немає ключа Groq');

      let messages = [{ role: 'user', content: promptText }];
      if (sysPrompt) {
        messages.unshift({ role: 'system', content: sysPrompt });
      }

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
        // Використовуємо актуальну модель, яка підтримується Groq
        body: JSON.stringify({ model: 'openai/gpt-oss-20b', messages: messages })
      });

      if (!res.ok) throw new Error('Groq: ' + res.status);
      const data = await res.json();
      return data.choices?.[0]?.message?.content?.trim() || '';
    }

    // Універсальний запит: пробуємо Gemini -> якщо 429 або 503 -> Groq.
    // Якщо Groq видає помилку -> пробуємо знову Gemini.
    async function callAI(promptText, sysPrompt = null) {
      try {
        return await callGeminiAPI(promptText, sysPrompt);
      } catch (e) {
        if (e.message === 'RATE_LIMIT' || e.message.includes('503')) {
          statusEl.textContent = 'Gemini недоступний. Перемикаюсь на Groq...';
          try {
            return await callGroqAPI(promptText, sysPrompt);
          } catch (groqError) {
            statusEl.textContent = 'Groq також недоступний. Спробую Gemini ще раз...';
            return await callGeminiAPI(promptText, sysPrompt);
          }
        }
        throw e;
      }
    }

    // Оновлена функція озвучення
    function speak(text, lang) {
      if (window.AndroidTTS && typeof window.AndroidTTS.speak === 'function') {
        // Додаємо міні-затримку, щоб Android TTS встиг ініціалізуватися
        setTimeout(() => {
            window.AndroidTTS.speak(text, lang);
        }, 100);
        return;
      }
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    async function translateText(text, from, to) {
      const prompt = `Переклади наступний текст з ${from} на ${to}. Поверни ТІЛЬКИ переклад без коментарів.\n\nТекст:\n${text}`;
      return await callAI(prompt);
    }

    // --- МІКРОФОНИ ---
    document.getElementById('micUk').addEventListener('click', () => {
      if (listening) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { statusEl.textContent = 'Мікрофон не підтримується.'; return; }
      recognition = new SR();
      recognition.lang = 'uk-UA';
      listening = true;
      statusEl.textContent = 'Слухаю українську...';
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        originalEl.textContent = text;
        statusEl.textContent = 'Перекладаю...';
        try {
          const res = await translateText(text, 'української', 'німецьку');
          translatedEl.textContent = res;
          speak(res, 'de-DE');
          statusEl.textContent = 'Готово.';
        } catch (e) { statusEl.textContent = 'Помилка: ' + e.message; }
      };
      recognition.onend = () => listening = false;
      recognition.start();
    });

    document.getElementById('micDe').addEventListener('click', () => {
      if (listening) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { statusEl.textContent = 'Мікрофон не підтримується.'; return; }
      recognition = new SR();
      recognition.lang = 'de-DE';
      listening = true;
      statusEl.textContent = 'Слухаю німецьку...';
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        originalEl.textContent = text;
        statusEl.textContent = 'Перекладаю...';
        try {
          const res = await translateText(text, 'німецької', 'українську');
          translatedEl.textContent = res;
          speak(res, 'uk-UA');
          statusEl.textContent = 'Готово.';
        } catch (e) { statusEl.textContent = 'Помилка: ' + e.message; }
      };
      recognition.onend = () => listening = false;
      recognition.start();
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (recognition && listening) recognition.stop();
      if (window.AndroidTTS) window.AndroidTTS.stop();
      statusEl.textContent = 'Зупинено.';
    });

    // --- ТРЕНЕР B2 ---
    function addMessageToChat(role, text) {
      history.push({ role: role, content: text });
      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg-user' : 'msg-ai';
      div.textContent = (role === 'user' ? '🧑 ' : '👨‍🏫 ') + text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendTrainerText(text) {
      if (!text.trim()) return;
      addMessageToChat('user', text);
      statusTrainer.textContent = 'Думаю...';

      try {
        const scen = document.getElementById('scenario').value;
        let sysPrompt = `Du bist ein Prüfer für die Goethe-Prüfung B2 (Sprechen). Du sprichst ausschließlich Deutsch. Stelle Fragen, reagiere auf die Antworten und gib kurze Hinweise auf Fehler. Antworte kurz und natürlich.`;
        if (scen === 'praesentation') sysPrompt += `\nSzenario: Teil 1 – Selbstpräsentation.`;
        if (scen === 'diskussion') sysPrompt += `\nSzenario: Teil 2 – Diskussion. Thema: Handyverbot in der Schule.`;
        if (scen === 'planung') sysPrompt += `\nSzenario: Teil 3 – Gemeinsame Planung. Plane einen Betriebsausflug.`;

        // Формуємо контекст
        let promptForAI = text;
        if (history.length > 1) {
            promptForAI = "Bisheriger Dialog:\n" + history.slice(-5).map(m => `${m.role}: ${m.content}`).join('\n') + `\n\nNeue Antwort des Schülers: ${text}`;
        }

        const reply = await callAI(promptForAI, sysPrompt);
        addMessageToChat('assistant', reply);
        speak(reply, 'de-DE');
        statusTrainer.textContent = 'Готово.';
      } catch (e) {
        statusTrainer.textContent = 'Помилка: ' + e.message;
      }
    }

    document.getElementById('micTrainer').addEventListener('click', () => {
      if (listening) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { statusTrainer.textContent = 'Мікрофон не підтримується.'; return; }
      recognition = new SR();
      recognition.lang = 'de-DE';
      listening = true;
      statusTrainer.textContent = 'Слухаю німецьку...';
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        sendTrainerText(text);
      };
      recognition.onend = () => listening = false;
      recognition.start();
    });

    document.getElementById('stopTrainer').addEventListener('click', () => {
      if (recognition && listening) recognition.stop();
      if (window.AndroidTTS) window.AndroidTTS.stop();
      statusTrainer.textContent = 'Зупинено.';
    });

    document.getElementById('resetTrainer').addEventListener('click', () => {
      history = [];
      chatEl.innerHTML = '';
      statusTrainer.textContent = 'Нова розмова.';
    });

    document.getElementById('sendTrainer').addEventListener('click', () => {
      const t = document.getElementById('manualTrainer').value;
      document.getElementById('manualTrainer').value = '';
      sendTrainerText(t);
    });

    // --- РУЧНЕ ВВЕДЕННЯ ---
    document.getElementById('sendUk').addEventListener('click', async () => {
      const t = document.getElementById('manualInput').value.trim();
      if (!t) return;
      originalEl.textContent = t;
      try {
        const res = await translateText(t, 'української', 'німецьку');
        translatedEl.textContent = res;
        speak(res, 'de-DE');
      } catch (e) { statusEl.textContent = 'Помилка: ' + e.message; }
    });

    document.getElementById('sendDe').addEventListener('click', async () => {
      const t = document.getElementById('manualInput').value.trim();
      if (!t) return;
      originalEl.textContent = t;
      try {
        const res = await translateText(t, 'німецької', 'українську');
        translatedEl.textContent = res;
        speak(res, 'uk-UA');
      } catch (e) { statusEl.textContent = 'Помилка: ' + e.message; }
    });
</script>
</body>
</html>
